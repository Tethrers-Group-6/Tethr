<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>
            Balances
        </title>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="../resources/css/styles.css">
    </head>

    <body class="bg-light">
        <nav class="navbar bg-white border-bottom">
            <div class="container">
                <a class="navbar-brand" href="/home">
                    <img src="../resources/img/Tethr_Logo.png" alt="Tethr" height="75">
                </a>
            </div>
        </nav>

        <main class="container py-4">
            <h1 class="h3 mb-3">
                Balances
            </h1>

            <!-- Feedback messages (payment saved, or "showing sample data") -->
            <p id="notice" class="alert alert-secondary" role="status" hidden></p>

            <!-- Totals (same math as the dashboard) -->
            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <div class="card h-100 p-3">
                        <p class="small text-uppercase text-body-secondary mb-0">
                            You Owe:
                        </p>
                        <p id="total-owe" class="display-6 fw-bold neg mb-0">
                            $0.00
                        </p>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card h-100 p-3">
                        <p class="small text-uppercase text-body-secondary mb-0">
                            Owed to You:
                        </p>
                        <p id="total-owed" class="display-6 fw-bold pos mb-0">
                            $0.00
                        </p>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card h-100 p-3">
                        <p class="small text-uppercase text-body-secondary mb-0">
                            Total Balance:
                        </p>
                        <p id="total-net" class="display-6 fw-bold mb-0">
                            $0.00
                        </p>
                        <p id="total-net-text" class="small text-body-secondary mb-0"></p>
                    </div>
                </div>
            </div>

            <!-- Payments waiting on someone (hidden when there are none) -->
            <section id="pending-section" class="card p-3 mb-3" aria-labelledby="pending-h" hidden>
                <h2 id="pending-h" class="h6">
                    Waiting to Be Confirmed
                </h2>
                <ul id="pending-list" class="list-group list-group-flush"></ul>
            </section>

            <div class="row g-3">
                <!-- People: one row per friend, combined across every circle -->
                <div class="col-lg-7">
                    <section class="card h-100 p-3" aria-labelledby="people-h">
                        <h2 id="people-h" class="h6">
                            People
                        </h2>
                        <p class="small text-body-secondary">
                            Your balance with each friend across all your circles. Select a person to see each circle and settle up.
                        </p>
                        <div id="people-list" class="list-group"></div>
                    </section>
                </div>

                <!-- Full history (the dashboard's "See All" lands here) -->
                <div class="col-lg-5">
                    <section class="card h-100 p-3" aria-labelledby="history-h">
                        <h2 id="history-h" class="h6">
                            All Activity
                        </h2>
                        <ul id="history-list" class="list-group list-group-flush list-striped"></ul>
                    </section>
                </div>
            </div>
        </main>

        <!-- Record a payment (used for both "I paid them" and "they paid me") -->
        <div class="modal fade" id="paymentModal" tabindex="-1" aria-labelledby="paymentLabel" aria-hidden="true">
            <div class="modal-dialog">
                <form class="modal-content" id="payment-form">
                    <div class="modal-header">
                        <h2 class="modal-title h5" id="paymentLabel">
                            Record Payment
                        </h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <div class="modal-body">
                        <p id="payment-error" class="alert alert-secondary" role="alert" hidden></p>
                        <p id="payment-summary" class="mb-3"></p>

                        <label for="payment-amount" class="form-label">
                            Amount
                        </label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="text" inputmode="decimal" class="form-control" id="payment-amount" name="amount" required aria-describedby="payment-help">
                        </div>
                        <div class="form-text" id="payment-help"></div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                            Cancel
                        </button>
                        <button type="submit" class="btn btn-dark" id="payment-submit">
                            Save
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Client Script -->
        <script src="../resources/js/balances.js"></script>
    </body>
</html>
