<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>
            Circles
        </title>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="../resources/css/styles.css">
    </head>

    <body class="bg-light">
        <nav></nav>

        <main class="container py-4" id="circles-page">
            <!-- Header + actions -->
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <h1 class="h3 mb-0">
                    My Circles
                </h1>

                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-outline-dark" data-bs-toggle="modal" data-bs-target="#newCircleModal">
                        + New Circle
                    </button>
                    <button type="button" class="btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#joinCircleModal">
                        Join with Code
                    </button>
                </div>
            </div>

            <!-- Feedback messages (success, or "showing sample data") -->
            <p id="notice" class="alert alert-secondary" role="status" hidden></p>

            <!-- Search (filters the cards in the browser) -->
            <div class="mb-3">
                <label for="circle-search" class="visually-hidden">
                    Search circles
                </label>
                <input type="search" id="circle-search" class="form-control" placeholder="Search your circles">
            </div>

            <!-- Cards are built by ../resources/js/circles.js -->
            <div id="circles-list" class="row g-3"></div>
        </main>

        <!-- New Circle modal -->
        <div class="modal fade" id="newCircleModal" tabindex="-1" aria-labelledby="newCircleLabel" aria-hidden="true">
            <div class="modal-dialog">
                <form class="modal-content" id="new-circle-form">
                    <div class="modal-header">
                        <h2 class="modal-title h5" id="newCircleLabel">
                            New Circle
                        </h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <div class="modal-body">
                        <p id="new-error" class="alert alert-secondary" role="alert" hidden></p>
                        <label for="circle-name" class="form-label">
                            Circle name
                        </label>
                        <input type="text" class="form-control" id="circle-name" name="name" required maxlength="100">
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                            Cancel
                        </button>
                        <button type="submit" class="btn btn-dark">
                            Create Circle
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Join Circle modal -->
        <div class="modal fade" id="joinCircleModal" tabindex="-1" aria-labelledby="joinCircleLabel" aria-hidden="true">
            <div class="modal-dialog">
                <form class="modal-content" id="join-circle-form">
                    <div class="modal-header">
                        <h2 class="modal-title h5" id="joinCircleLabel">
                            Join with Code
                        </h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <div class="modal-body">
                        <p id="join-error" class="alert alert-secondary" role="alert" hidden></p>
                        <label for="invite-code" class="form-label">
                            Invite code
                        </label>
                        <input type="text" class="form-control" id="invite-code" name="invite_code" required maxlength="20" placeholder="e.g. TETH-204">
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                            Cancel
                        </button>
                        <button type="submit" class="btn btn-dark">
                            Join Circle
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Client Script -->
        <script src="../resources/js/circles.js"></script>
    </body>
</html>
