<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>
            Profile
        </title>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="../resources/css/styles.css">
    </head>

    <body class="bg-light">
        <nav></nav>

        <main class="container py-4" id="profile-page">
            <h1 class="h3 mb-3">
                My Profile
            </h1>

            <!-- Feedback messages (saved, or "showing sample data") -->
            <p id="notice" class="alert alert-secondary" role="status" hidden></p>

            <div class="row g-3">
                <!-- Profile summary (filled in by ../resources/js/profile.js) -->
                <div class="col-md-5">
                    <section class="card h-100 p-3" aria-labelledby="profile-name">
                        <div class="d-flex align-items-center gap-3 mb-3">
                            <div id="profile-initials" class="avatar-initials" aria-hidden="true">?</div>
                            <div>
                                <h2 id="profile-name" class="h5 mb-0">Loading...</h2>
                                <p id="profile-email" class="small text-body-secondary mb-0"></p>
                            </div>
                        </div>

                        <dl class="row small mb-0">
                            <dt class="col-5 text-body-secondary fw-normal">Venmo</dt>
                            <dd class="col-7" id="profile-venmo">-</dd>

                            <dt class="col-5 text-body-secondary fw-normal">Circles</dt>
                            <dd class="col-7" id="profile-circles">-</dd>

                            <dt class="col-5 text-body-secondary fw-normal">Member since</dt>
                            <dd class="col-7 mb-0" id="profile-since">-</dd>
                        </dl>
                    </section>
                </div>

                <!-- Edit form -->
                <div class="col-md-7">
                    <form class="card h-100 p-3" id="profile-form" novalidate>
                        <h2 class="h5 mb-3">
                            Edit Profile
                        </h2>

                        <p id="form-error" class="alert alert-danger" role="alert" hidden></p>

                        <div class="mb-3">
                            <label for="display-name" class="form-label">
                                Display name
                            </label>
                            <input type="text" class="form-control" id="display-name" name="display_name" required maxlength="100" autocomplete="name">
                            <div class="form-text">
                                This is how your friends see you in shared Circles.
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="venmo-username" class="form-label">
                                Venmo username <span class="text-body-secondary">(optional)</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text">@</span>
                                <input type="text" class="form-control" id="venmo-username" name="venmo_username" maxlength="31" placeholder="your-venmo" aria-describedby="venmo-help">
                            </div>
                            <div class="form-text" id="venmo-help">
                                Used for "Pay with Venmo" links when friends settle up. Leave blank to remove it.
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">
                                Email
                            </label>
                            <input type="email" class="form-control" id="email" disabled>
                            <div class="form-text">
                                Your email is your login, so it can't be changed here.
                            </div>
                        </div>

                        <div class="d-flex gap-2 mt-auto">
                            <button type="submit" class="btn btn-dark" id="save-button">
                                Save Changes
                            </button>
                            <button type="button" class="btn btn-outline-secondary" id="reset-button">
                                Cancel
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Client Script -->
        <script src="../resources/js/profile.js"></script>
    </body>
</html>
