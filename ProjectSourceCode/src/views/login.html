<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Login</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="/resources/css/styles.css">
    </head>

    <body class="bg-light">
        <nav></nav>

        <main class="container py-4" id="login-page">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <form class="card p-3" id="login-form" novalidate>
                        <h1 class="h4 mb-3">Log in</h1>

                        <p id="form-error" class="alert alert-danger" role="alert" hidden></p>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" required autocomplete="email">
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                        </div>

                        <button type="submit" class="btn btn-dark w-100">Log in</button>

                        <p class="small text-center mt-3 mb-0">
<a href="/register">Register</a>
                        </p>
                    </form>
                </div>
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="/resources/js/login.js"></script>
    </body>
</html>
