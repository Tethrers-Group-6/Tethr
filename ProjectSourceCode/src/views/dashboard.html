<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <title>
            Dashboard
        </title>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="../resources/css/styles.css">
    </head>

    <body class="bg-light">
        <nav class="navbar bg-white border-bottom">
            <div class="container">
                <a class="navbar-brand" href="/home">
                    <img src="../resources/img/Tethr_Logo.png" alt="Tethr" height="75">
                </a>
            </div>
        </nav>

        <main class="container py-4">
            <h1 id="welcome" class="h3 mb-3">
                Welcome to your Dashboard!
            </h1>

            <p id="notice" class="alert alert-warning" role="status" hidden></p>

            <!-- Total Balance -->
            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <div class="card h-100 p-3">
                        <p class="small text-uppercase text-body-secondary mb-0">
                            You Owe:
                        </p>
                        
                        <p id="total-owe" class="display-6 fw-bold neg mb-0">
                            $0.00
                        </p>
                    </div>
                </div>
                
                <div class="col-md-4">
                    <div class="card h-100 p-3">
                        <p class="small text-uppercase text-body-secondary mb-0">
                            Owed to You:
                        </p>
                        
                        <p id="total-owed" class="display-6 fw-bold pos mb-0">
                            $0.00
                        </p>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card h-100 p-3">
                        <p class="small text-uppercase text-body-secondary mb-0">
                            Total Balance:
                        </p>

                        <p id="total-net" class="display-6 fw-bold mb-0">
                            $0.00
                        </p>

                        <p id="total-net-text" class="small text-body-secondary mb-0"></p>
                    </div>
                </div>
            </div>

            <!-- Recent history and top circles on left, with upcoming on right -->
            <div class="row g-3 md-4">
                <div class="col-lg-8 d-flex flex-column gap-3">
                    <section class="card p-3" aria-labelledby="recent-h">
                        <h2 id="recent-h" class="h6">
                            Recent Activity
                            <a href="/balances" class="float-end small fw-normal">
                                See All
                            </a>
                        </h2>

                        <ul id="recent-list" class="list-group list-group-flush list-striped"></ul>
                    </section>

                    <section class="card p-3" aria-labelledby="circles-h">
                        <h2 id="circles-h" class="h6">
                            Your Top Circles
                            <a href="/circles" class="float-end small fw-normal">
                                View All
                            </a>
                        </h2>
                        <div id="circles-list" class="row g-3"></div>
                    </section>
                </div>

                <div class="col-lg-4">
                    <section class="card h-100 p-3" aria-labelledby="upcoming-h">
                        <h2 id="upcoming-h" class="h6">
                            Upcoming
                            <a href="/events" class="float-end small fw-normal">
                                See More
                            </a>
                        </h2>

                        <ul id="upcoming-list" class="list-group list-group-flush"></ul>
                    </section>
                </div>
            </div>
        </main>

        <!-- New Circle modal -->
        <div class="modal fade" id="newCircleModal" tabindex="-1" aria-labelledby="newCircleLabel" aria-hidden="true">
            <div class="modal-dialog">
                <form class="modal-content" id="new-circle-form">
                    <div class="modal-header">
                        <h2 class="modal-title h5" id="newCircleLabel">
                            New Circle
                        </h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <div class="modal-body">
                        <p id="new-error" class="alert alert-secondary" role="alert" hidden></p>
                        <label for="circle-name" class="form-label">
                            Circle name
                        </label>
                        <input type="text" class="form-control" id="circle-name" name="name" required maxlength="100">
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                            Cancel
                        </button>
                        <button type="submit" class="btn btn-dark">
                            Create Circle
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Join Circle modal -->
        <div class="modal fade" id="joinCircleModal" tabindex="-1" aria-labelledby="joinCircleLabel" aria-hidden="true">
            <div class="modal-dialog">
                <form class="modal-content" id="join-circle-form">
                    <div class="modal-header">
                        <h2 class="modal-title h5" id="joinCircleLabel">
                            Join with Code
                        </h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <div class="modal-body">
                        <p id="join-error" class="alert alert-secondary" role="alert" hidden></p>
                        <label for="invite-code" class="form-label">
                            Invite code
                        </label>
                        <input type="text" class="form-control" id="invite-code" name="invite_code" required maxlength="20" placeholder="e.g. TETH-204">
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                            Cancel
                        </button>
                        <button type="submit" class="btn btn-dark">
                            Join Circle
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Client Script -->
        <script src="../resources/js/dashboard.js"></script>
    </body>
</html>
