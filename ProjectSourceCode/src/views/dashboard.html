<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <title>
            Dashboard
        </title>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="../resources/css/styles.css">
    </head>

    <body class="bg-light">
        <nav></nav>

        <main class="container py-4">
            <h1 id="welcome" class="h3 mb-3">
                Welcome to your Dashboard!
            </h1>

            <p id="notice" class="alert alert-warning" role="staus" hidden></p>

            <!-- Total Balance -->
            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <div class="card h-100 p-3">
                        <p class="small text-uppercase text-body-secondary mb-0">
                            You Owe:
                        </p>
                        
                        <p id="total-owe" class="display-6 fw-bold neg mb-0">
                            $0.00
                        </p>
                    </div>
                </div>
                
                <div class="col-md-4">
                    <div class="card h-100 p-3">
                        <p class="small text-uppercase text-body-secondary mb-0">
                            Owed to You:
                        </p>
                        
                        <p id="total-owed" class="display-6 fw-bold pos mb-0">
                            $0.00
                        </p>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card h-100 p-3">
                        <p class="small text-uppercase text-body-secondary mb-0">
                            Total Balance:
                        </p>

                        <p id="total-net" class="display-6 fw-bold mb-0">
                            $0.00
                        </p>

                        <p id="total-net-text" class="small text-body-secondary mb-0"></p>
                    </div>
                </div>
            </div>

            <!-- Recent history and top circles on left, with upcoming on right -->
            <div class="row g-3 md-4">
                <div class="col-lg-8 d-flex flex-column gap-3">
                    <section class="card p-3" aria-labelledby="recent-h">
                        <h2 id="recent-h" class="h6">
                            Recent Activity
                            <a href="balances.html" class="float-end small fw-normal">
                                See All
                            </a>
                        </h2>

                        <ul id="recent-list" class="list-group list-group=flush list-striped"></ul>
                    </section>

                    <section class="card p-3" aria-labelledby="circles-h">
                        <h2 id="circles-h" class="h6">
                            Your Top Circles
                            <a href="circles.html" class="float-end small fw-normal">
                                View All
                            </a>
                        </h2>
                        <div id="circles-list" class="row g-3"></div>
                    </section>
                </div>

                <div class="col-lg-4">
                    <section class="card h-100 p-3" aria-labelledby="upcoming-h">
                        <h2 id="upcoming-h" class="h6">
                            Upcoming
                            <a href="events.html" class="float-end small fw-normal">
                                See More
                            </a>
                        </h2>

                        <ul id="upcoming-list" class="list-group list-group-flush"></ul>
                    </section>
                </div>
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
