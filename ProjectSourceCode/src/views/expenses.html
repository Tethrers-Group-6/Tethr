<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>
            Add Expense
        </title>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="../resources/css/styles.css">
    </head>

    <body class="bg-light">
        <nav class="navbar bg-white border-bottom">
            <div class="container">
                <a class="navbar-brand" href="/home">
                    <img src="../resources/img/Tethr_Logo.png" alt="Tethr" height="75">
                </a>
            </div>
        </nav>

        <main class="container py-4" id="expense-page">
            <!-- Header -->
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <h1 class="h3 mb-0">
                    Add an Expense
                </h1>

                <a href="/circles" class="btn btn-outline-secondary btn-sm">
                    Back to Circles
                </a>
            </div>

            <!-- Shown after a successful save, with who owes what -->
            <section id="result" class="alert alert-success" role="status" hidden>
                <p id="result-title" class="fw-bold mb-2"></p>
                <ul id="result-splits" class="list-unstyled mb-2"></ul>
                <a id="result-link" href="/circles" class="alert-link">View circle</a>
            </section>

            <p id="notice" class="alert alert-secondary" role="status" hidden></p>
            <p id="form-error" class="alert alert-danger" role="alert" hidden></p>

            <form id="expense-form" class="border rounded bg-white p-3" novalidate>
                <div class="mb-3">
                    <label for="circle" class="form-label">
                        Circle
                    </label>
                    <select id="circle" class="form-select" required></select>
                </div>

                <div class="mb-3">
                    <label for="name" class="form-label">
                        What was it for?
                    </label>
                    <input type="text" id="name" class="form-control" maxlength="100" required placeholder="e.g. Weekly groceries">
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-sm-6">
                        <label for="amount" class="form-label">
                            Total amount
                        </label>
                        <div class="input-group">
                            <span class="input-group-text">$</span>
                            <input type="text" id="amount" class="form-control" inputmode="decimal" required placeholder="0.00">
                        </div>
                    </div>

                    <div class="col-sm-6">
                        <label for="expense-date" class="form-label">
                            Date
                        </label>
                        <input type="date" id="expense-date" class="form-control">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="note" class="form-label">
                        Note (optional)
                    </label>
                    <input type="text" id="note" class="form-control" maxlength="500">
                </div>

                <fieldset class="mb-3">
                    <legend class="form-label fs-6">
                        Split equally between
                    </legend>
                    <div id="participants" class="d-flex flex-column gap-1"></div>
                    <p class="form-text mb-0">
                        You paid, so you're always part of the split.
                    </p>
                </fieldset>

                <button type="submit" id="submit-btn" class="btn btn-dark">
                    Add Expense
                </button>
            </form>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <!-- Client Script -->
        <script src="../resources/js/expenses.js"></script>
    </body>
</html>
