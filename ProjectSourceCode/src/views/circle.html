<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>
            Circle
        </title>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="../resources/css/styles.css">
    </head>

    <body class="bg-light">
        <nav class="navbar bg-white border-bottom">
            <div class="container">
                <a class="navbar-brand" href="/home">
                    <img src="../resources/img/Tethr_Logo.png" alt="Tethr" height="75">
                </a>
            </div>
        </nav>

        <main class="container py-4" id="circle-page">
            <p id="error" class="alert alert-danger" role="alert" hidden></p>

            <!-- Header + actions -->
            <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3">
                <div>
                    <h1 id="circle-name" class="h3 mb-1">
                        Loading...
                    </h1>
                    <p id="invite-line" class="small text-body-secondary mb-0" hidden></p>
                </div>

                <div class="d-flex gap-2">
                    <a id="add-expense" href="/expenses" class="btn btn-dark" hidden>
                        + Add Expense
                    </a>
                    <a href="/circles" class="btn btn-outline-secondary">
                        Back to Circles
                    </a>
                </div>
            </div>

            <div class="row g-3">
                <!-- Expenses -->
                <div class="col-lg-8">
                    <section class="border rounded bg-white p-3 h-100" aria-labelledby="expenses-heading">
                        <h2 id="expenses-heading" class="h5 mb-3">
                            Expenses
                        </h2>
                        <ul id="expense-list" class="list-group list-group-flush"></ul>
                    </section>
                </div>

                <!-- Members -->
                <div class="col-lg-4">
                    <section class="border rounded bg-white p-3 h-100" aria-labelledby="members-heading">
                        <h2 id="members-heading" class="h5 mb-3">
                            Members
                        </h2>
                        <ul id="member-list" class="list-group list-group-flush"></ul>
                    </section>
                </div>
            </div>
        </main>

        <!-- Client Script -->
        <script src="../resources/js/circle.js"></script>
    </body>
</html>
